(function(){

/* ①(2026-09-24 上游 Firefox 回归 Bug 2056444 · blob 喂媒体的**有界重试**兜底看门狗)
   为什么会有这一条：上游 Bug 2005247（Firefox 152 起）把 blob 数据改成**内容进程经 IPC 读**
   （`RemoteLazyInputStream`），流不再同步报长度 ⇒ `BaseMediaResource::Create` 落到
   `CloneableWithRangeMediaResource`；那个资源类在**异步 IPC 流上做同步读** ⇒ 首次元数据读
   （MP4 的 moov 常在同一文件尾部 = 远端 seek）**挂住**：`readyState` 恒 0、`networkState` 恒 1、
   **不触发 error**、`play()` 的 promise 永不 settle。触发体积 = blob 数据 > **1MB 的 IPC 内联上限**。
   上游已修：155 nightly → beta 154 → release 153（153.0.3）/ ESR153。
   四条实测证据（同机同字节，均可独立复算）：
     · tests/mpkg-video-codec-probe.mjs       —— 先排除"编解码器/容器罕见"（h264/yuv420p/30s，canPlayType=probably）
     · tests/mpkg-video-decode-probe.mjs      —— 最小页面：HTTP 直供 rs=4（约 0.4s）；22MB blob 恒 rs=0；
                                                 14KB blob rs=4；new Blob / new File / new Response().blob() / data:
                                                 四种写法**全部**复现挂住
     · tests/mpkg-videobase-live-probe.mjs    —— 真页面：`__videoBase` 元素 rs=0 ns=1 err=null；
                                                 同一个 blob URL 换新元素、或原元素再 `load()` 一次，都能出数据
     · tests/mpkg-videobase-recovery-probe.mjs —— 收尾：**只补一次 `load()`** 就恢复（rs=4 / 1636x1156 /
                                                 dur=30 / buffered=30），画布真的画出视频底层
                                                 （截图亮度 meanL 94.408 → 8.901）
   结论：**再补一次 `load()`** 是页内可用的兜底；**健康浏览器上永不触发**（rs≥1 早在 1.5s 内到达
   ⇒ 本看门狗一次 `load()` 都不调）。判据：tests/blob-media-retry-test.mjs（结构自推导 + 行为 + 变异自证）。
   调用点一律写成 `try { mpwBlobMediaRetry(el, '…') } catch (e) {}`：本文件有若干**切片 harness**
   （把某段原文丢进 `new Function` 跑的离线测试）拿不到这个模块内符号 ⇒ 那里的 ReferenceError 必须被
   吞掉，否则会打挂既有判据；真页面里它永远定义在调用点之前（紧跟 `logf` 之后）。
   计数钩子 `window.__mpwBlobMediaRetry`（只在 window 存在时写，**不引入别的全局**）：
     · calls    = 本看门狗挂到媒体元素上的次数（同一元素换曲再挂一次 = 再 +1）
     · retries  = 累计真的补出去的 `load()` 次数
     · gaveUp   = 2 次用尽仍 rs=0（没出元数据）的元素数
     · byLabel  = { [label]: { calls, retries, gaveUp } }，label = 各接线点给的短中文名 */
function mpwBlobMediaRetry(el, label) {
  try {
    if (!el) return
    const GAP = 1500, MAX = 2, tag = label || '?'
    let H = null
    try {
      if (typeof window !== 'undefined' && window) {
        H = window.__mpwBlobMediaRetry || (window.__mpwBlobMediaRetry = { calls: 0, retries: 0, gaveUp: 0, byLabel: {} })
        if (!H.byLabel || typeof H.byLabel !== 'object') H.byLabel = {}
      }
    } catch (e) { H = null }
    // 计数一律走这里：外部若动过钩子对象（缺字段/被替换）也只当没记账，绝不把看门狗打挂
    const bump = (k) => {
      try {
        if (!H) return
        H[k] = (H[k] || 0) + 1
        const b = H.byLabel[tag] || (H.byLabel[tag] = { calls: 0, retries: 0, gaveUp: 0 })
        b[k] = (b[k] || 0) + 1
      } catch (e) { /* ignore */ }
    }
    bump('calls')
    const state = () => {
      let rs = 0, err = null
      try { rs = el.readyState || 0 } catch (e) { rs = 0 }
      try { err = el.error || null } catch (e) { err = null }
      return { rs, err }
    }
    let tries = 0, done = false
    const tick = () => {
      if (done) return
      const s = state()
      // 拿到元数据（rs≥1）或已报错 ⇒ **立刻停**：不再重试、不再计时（后续 tick 直接返回）
      if (s.err || s.rs >= 1) { done = true; return }
      if (tries >= MAX) {
        done = true
        bump('gaveUp')
        try { logf('⚠ ' + tag + '：始终未出元数据 rs=0，已重试 2 次（上游 Firefox Bug 2056444：blob >1MB 走 IPC 异步流、首次元数据同步读挂住；升级到 153.0.3+/154/155/ESR153 即恢复）') } catch (e) {}
        return
      }
      tries++
      bump('retries')
      try { logf('🔁 ' + tag + '：blob 首次 load 挂住（rs=0），第 ' + tries + '/' + MAX + ' 次补 load()（上游 Firefox Bug 2056444）') } catch (e) {}
      // 这次 `load()` 会**主动中断**上一发尚未 settle 的 `play()` —— 它的 reject 是**预期内**的，
      //   不是"自动播放被拒"。在元素上记一笔"预期中断数"，调用点的 `play().catch` 消费它，
      //   免得日志里冒出一行与事实相反的"自动播放失败"（真机实测过：视频其实在放，日志却在报失败）。
      try { el.__mpwBlobRetryAborts = (el.__mpwBlobRetryAborts || 0) + 1 } catch (e) {}
      try { el.load() } catch (e) { /* load() 抛错（元素已摘除等）一律吞掉 */ }
      try {
        const p = el.play()
        if (p && typeof p.catch === 'function') {
          p.catch((e) => {
            // 补 load() 之后的播放若真被拒（自动播放策略等），如实报一次（每个元素只报一次，不刷屏）
            try { if (!el.__mpwBlobRetryPlayWarned) { el.__mpwBlobRetryPlayWarned = 1; logf('⚠ ' + tag + '：补 load() 后自动播放被拒（' + ((e && e.name) || '?') + '），画面会停在首帧') } } catch (e2) {}
          })
        }
      } catch (e) { /* play() 同步抛错同样不外泄 */ }
      try { setTimeout(tick, GAP) } catch (e) { done = true }
    }
    const s0 = state()
    // 首次检查不打扰健康浏览器：rs≥1 / error 非空 ⇒ 一次 `load()` 都不调、也不计时
    if (s0.err || s0.rs >= 1) return
    try { setTimeout(tick, GAP) } catch (e) { /* 无 setTimeout：不打扰，也不抛 */ }
  } catch (e) { /* 绝不外泄：元素已从 DOM 摘掉 / load() 抛错 / window 不存在……全部吞掉 */ }
}

//    `classes.dex` 的 ParallaxController 字节码里（本机无 dex 反编译器 ⇒ 只取到常量**名**、取不到**值**）。
//    ⇒ 本段的映射是**本仓自定**（依据强度 ③：可判定、可复现、可现场改），只借官方两件事：
//      轴与量程（①）、"官方把这一档叫 Device Motion 且有 strength 滑块"（②）。
//    ⚠ 方向正负与"±多少度满幅"**必须真机确认**（本机没有传感器）：要翻转只改下面三个常量。
//
// ── 开关语义（`?gyro=`；与 `?parallax=` / `?ptrfx=` / `?cursor=off` 正交）──────────────────
//   · 缺省 / auto：`matchMedia('(pointer: fine)')` 命中（有鼠标/触控板）⇒ **不启用**；
//     没有细指针且是触摸设备（`navigator.maxTouchPoints > 0` 或 `'ontouchstart' in window`）⇒ 启用；
//     两者都不成立（桌面无触摸）⇒ 不启用。有鼠标时绝不动：注入通道一旦被姿态占住，真鼠标就失效。
//   · `?gyro=1|on|force`：强制启用（桌面/测试台现场看效果；也可 `window.__mpwGyroSrc.feed({beta,gamma})`
//     手动喂读数，不需要真传感器）。
//   · `?gyro=0|off|none`：**完全不监听**（一个 deviceorientation 监听都不挂，判据 ④ 钉住）。
//   · 与 `?parallax=` 正交：`?parallax` 只门控"视差"那一支（bundle :11200 的
//     `parEnabled && parallaxOff !== true`）；缺省**关**是 2026-09-12 的用户要求，本段不碰。
//     ⇒ 没开 `?parallax=1` 时姿态源**仍然喂指针**（乙/丙两条链），只是相机视差不跟。
//   · 与 `?ptrfx=` 正交：`?ptrfx=legacy` 只让效果链那 7 个 uniform **一个都不写**（逐位回到改动前），
//     姿态源照常喂指针/视差 ⇒ 那 7 个 uniform 看不到姿态（这是 legacy 的定义，不是本段的 bug）。
//   · 与 `?cursor=off` 正交：它只挡 `__hookPointer()`/`__hookPageLeave()`（画布 DOM 链）；
//     注入通道与视差链照旧 ⇒ 姿态源仍可用（只是乙那条画布事件没人听）。
//   ⚠ 本开关**没有**登记进 `docs/README-DIAGNOSTICS.md` 的开关表：那张表与 `web/diag-flags.json`、
//     面板内置副本三处联动，都不在本轮的写入清单里（见本轮交接报告）。因此这里把解析放在
//     **纯函数** `mpwGyroModeFrom(search)` 里（不是 `new URLSearchParams(location.search).get(...)` 链），
//     `node tests/diag-flag-check.mjs` 不会把 `gyro` 抽成"代码有·文档无" ⇒ docs-check 保持全绿。
//
// ── 诚实边界 ────────────────────────────────────────────────────────────────────────
//   · 本段只做**离线可判定**：mock window + 合成绩度事件 + mock-GL 视差读数（tests/gyro-parallax-test.mjs）。
//   · `deviceorientation` 在非安全上下文（http 且非 localhost）里浏览器不发事件 ⇒ "无事件"记账分支
//     （`__mpwGyro.why === 'no-events'`）就是这条的现场证据。
//   · iOS 13+ 需 `DeviceOrientationEvent.requestPermission()`（用户手势内）：有该方法就请求，
//     被拒/抛错只记一条（`__mpwGyro.permission`），不写死成"不可用"、不抛。
const MPW_GYRO_DEFAULTS = Object.freeze({
  // 满幅量程（度）：`gamma` 偏离中心 ±range ⇒ u 走完 0.5→0/1（beta 同理走 v）。
  // 30° ≈ 手机在手里正常腕部翻转的量级；官方量程（±90/±180）大得多，直接用会让小幅晃动几乎看不见。
  range: 30,
  // 一阶低通（EMA）系数：1 = 原样透传。视差链下游另有 cameraparallaxdelay 平滑，但指针链没有
  // （粒子/效果 uniform 直接吃注入值）⇒ 留一个轻平滑消传感器抖动。EMA 不改单调性、不越 [0,1]。
  smooth: 0.35,
  // 已挂监听但这么久还没有一个有效读数 ⇒ 记一条"没事件"（无传感器 / 权限未批 / 非安全上下文）。
  noEventMs: 3000,
})
const MPW_GYRO_CENTER = 0.5   // u/v 中心，与鼠标屏幕中心同一口径（parallaxState 缺省也是 0.5/0.5）
const MPW_GYRO_SIGN_U = 1     // γ>0（设备右侧下沉、镜头朝右转）⇒ u→1（= 鼠标右移）；真机反了改 -1
const MPW_GYRO_SIGN_V = 1     // β 增大（镜头向下俯）⇒ v→1（= 鼠标下移）；真机反了改 -1

/** 设备角 → [0,1] 的钳位（非有限值 ⇒ 0.5，绝不把 NaN 放进 uv）。 */
function mpwGyroClamp01(x) {
  if (!Number.isFinite(x)) return MPW_GYRO_CENTER
  return x < 0 ? 0 : (x > 1 ? 1 : x)
}

/**
 * `?gyro=` 档位解析（纯函数：输入是 search 串，不碰 location）。
 * 缺省/`auto`/垃圾值 ⇒ `'auto'`（**不静默当 on**）；`1|on|force|true` ⇒ `'on'`；`0|off|none|false` ⇒ `'off'`。
 */
/** 原始值 → 档位（`on` / `off` / `auto`）。**唯一**的判定语义（`mpwGyroModeFrom(search)` 与接线处
 *  读到的 `?gyro=` 都走这里，避免两套口径）。 */
function mpwGyroModeOfValue(v) {
  const raw = (v === null || v === undefined) ? '' : String(v).trim().toLowerCase()
  if (raw === '1' || raw === 'on' || raw === 'force' || raw === 'true') return 'on'
  /* ①(2026-09-24 口径修正) **缺省 = 不启用（opt-in）**：项目所有者说明"陀螺仪只是讲实现方式的区别、
     并不是要你做出陀螺仪效果"（桌面端本来也没有传感器）⇒ 姿态源**默认一个监听都不挂**，
     要现场验证或真在手机上用时显式给 `?gyro=1`（强制）或 `?gyro=auto`（触摸设备才启用）。 */
  if (raw === 'auto') return 'auto'
  return 'off'
}
function mpwGyroModeFrom(search) {
  try {
    const mpwGyroQ = new URLSearchParams(String(search || ''))
    return mpwGyroModeOfValue(mpwGyroQ.get('gyro'))
  } catch (e) { return 'auto' }
}

/** 单个角度的取值：缺字段（null/undefined/''）与 NaN/Infinity 一律判"量不到"。 */
function mpwGyroReadDeg(v) {
  if (v === null || v === undefined || v === '') return NaN
  const n = Number(v)
  return Number.isFinite(n) ? n : NaN
}

/**
 * 姿态角 → 与鼠标同一套的归一坐标（[0,1]，中心 0.5，Y 朝下同口径）。
 * 依据：轴/量程取官方规范（段头 ①）；换算式与 range 是本仓自定（段头 ③）。
 * @param {number} beta  前后倾（度，官方量程 [−180,180)）
 * @param {number} gamma 左右倾（度，官方量程 [−90,90)）
 * @param {{range?:number, center?:{beta:number,gamma:number}}} cfg `center` = 中立姿态（缺/非有限 ⇒ 无效读数）
 * @returns {{u:number,v:number}|null} null = 无效读数（缺字段/NaN/超量程）⇒ 调用方只记账、不写状态
 */
function mpwGyroUv(beta, gamma, cfg) {
  const c = cfg || {}
  const range = Number(c.range) > 0 ? Number(c.range) : MPW_GYRO_DEFAULTS.range
  const ctr = c.center || {}
  // ⚠ 用 mpwGyroReadDeg 而不是 Number()：`Number(null) === 0` 会把"缺字段"当成"0 度中立位"
  const cBeta = mpwGyroReadDeg(ctr.beta)
  const cGamma = mpwGyroReadDeg(ctr.gamma)
  if (!Number.isFinite(cBeta) || !Number.isFinite(cGamma)) return null   // 还没定中立位 ⇒ 不产出
  if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return null
  if (beta < -180 || beta > 180) return null                            // 超官方量程
  if (gamma < -90 || gamma > 90) return null
  const u = MPW_GYRO_CENTER + MPW_GYRO_SIGN_U * (gamma - cGamma) / (2 * range)
  const v = MPW_GYRO_CENTER + MPW_GYRO_SIGN_V * (beta - cBeta) / (2 * range)
  return { u: mpwGyroClamp01(u), v: mpwGyroClamp01(v) }
}

/**
 * auto 档判定：有细指针（鼠标/触控板）⇒ 不动；否则触摸设备 ⇒ 启用；否则看有没有传感器 API。
 * @returns {{on:boolean, why:string}} why 进 `__mpwGyro.why` 与日志（现场一眼看得出为什么没启用）
 */
function mpwGyroAutoDecide(win, nav) {
  if (!win) return { on: false, why: 'no-window' }
  let fine = false
  try { fine = !!(typeof win.matchMedia === 'function' && win.matchMedia('(pointer: fine)').matches) } catch (e) { fine = false }
  if (fine) return { on: false, why: 'fine-pointer' }
  const n = nav || win.navigator || null
  let touch = false
  try { touch = (Number(n && n.maxTouchPoints) > 0) || (Number(n && n.msMaxTouchPoints) > 0) || ('ontouchstart' in win) } catch (e) { touch = false }
  if (touch) return { on: true, why: 'touch' }
  const hasApi = (typeof win.DeviceOrientationEvent !== 'undefined') || ('ondeviceorientation' in win)
  return hasApi ? { on: true, why: 'no-fine-pointer' } : { on: false, why: 'no-sensor-api' }
}

/** iOS 13+ 的 `DeviceOrientationEvent.requestPermission()` 是否存在（安卓没有它 ⇒ 走不到）。 */
function mpwGyroNeedsPermission(win) {
  try {
    const C = win && win.DeviceOrientationEvent
    return !!(C && typeof C.requestPermission === 'function')
  } catch (e) { return false }
}

/**
 * 姿态源：监听 `deviceorientation`（必要时 `deviceorientationabsolute`），把姿态映射成 u/v 交给 sink。
 *
 * 状态对象（**同一个对象引用**，随时可读、字段就地更新）发布到 `window.__mpwGyro`：
 *   `{ supported, mode, enabled, listening, permission, events, invalid, ignored, applied, listeners,
 *      last:{alpha,beta,gamma}, uv:{u,v}, center:{beta,gamma,source}, why, noEvents, publishFailures, ... }`
 * 记账口径：`events` 只数**有效读数**；`invalid` 数无效读数（缺字段/NaN/超量程）；`ignored` 数
 * "未启用时收到的读数"；`applied` 数真正推给下游的次数；`publishFailures/publishFallbacks` 数状态发布失败。
 *
 * @param {object} [opts] `win`/`doc`/`navigator`（可注入，离线判据用）/`search`/`mode`/`cfg`/
 *   `center:{beta,gamma}`（不传 = **首个有效读数当中立位**：手机怎么拿都从中心起，只跟相对偏转）/
 *   `onUv`/`log`
 */
function mpwCreateGyroSource(opts) {
  const o = opts || {}
  const win = o.win || (typeof window !== 'undefined' ? window : null)
  const doc = o.doc || (typeof document !== 'undefined' ? document : null)
  const cfg = Object.assign({}, MPW_GYRO_DEFAULTS, o.cfg || {})
  const nav = o.navigator || ((win && win.navigator) || null)
  let search = o.search
  if (search === undefined) { try { search = (win && win.location) ? win.location.search : '' } catch (e) { search = '' } }
  /* ①(P-178) `gyroRaw` = 接线处从 `location.search` 显式读到的那一个值（诊断开关的唯一权威读点）；
     没给（例如测试切片直接调桥接）就退回 `search` 解析。两条路径落到**同一个** `mpwGyroModeOfValue`。 */
  const mode = o.mode || ((o.gyroRaw === undefined || o.gyroRaw === null)
    ? mpwGyroModeFrom(search)
    : mpwGyroModeOfValue(o.gyroRaw))
  const log = (typeof o.log === 'function') ? o.log : (() => {})
  const want = (o.center && typeof o.center === 'object') ? o.center : null
  const wBeta = want ? mpwGyroReadDeg(want.beta) : NaN
  const wGamma = want ? mpwGyroReadDeg(want.gamma) : NaN
  let sink = (typeof o.onUv === 'function') ? o.onUv : null
  let timer = null
  let published = false
  let gestureArmed = false

  const state = {
    supported: false, mode: mode, enabled: false, listening: false, permission: 'n/a',
    events: 0, invalid: 0, ignored: 0, applied: 0, listeners: 0, sinkErrors: 0, logs: 0,
    last: { alpha: null, beta: null, gamma: null },
    uv: { u: MPW_GYRO_CENTER, v: MPW_GYRO_CENTER },
    center: {
      beta: Number.isFinite(wBeta) ? wBeta : null,
      gamma: Number.isFinite(wGamma) ? wGamma : null,
      source: (Number.isFinite(wBeta) && Number.isFinite(wGamma)) ? 'explicit' : 'first-event',
    },
    why: '', noEvents: false, lastEventTime: 0,
    publishFailures: 0, publishFallbacks: 0, gestureArmed: false,
  }

  function say(msg) { state.logs++; try { log(msg) } catch (e) { /* 记账日志本身不许抛 */ } }

  /** 把状态对象挂到 `window.__mpwGyro`（有 defineProperty 就用它；不可用/被冻 ⇒ 退普通赋值并计数）。 */
  function publish() {
    if (!win) return
    try {
      if (!published) {
        if (typeof Object.defineProperty === 'function') {
          Object.defineProperty(win, '__mpwGyro', { value: state, writable: true, configurable: true, enumerable: false })
        } else { win.__mpwGyro = state }
        published = true
      } else { win.__mpwGyro = state }
    } catch (e) {
      try { win.__mpwGyro = state; state.publishFallbacks++ } catch (e2) { state.publishFailures++ }
    }
  }

  /** 唯一写入路径：设备读数（真事件或 `feed()`）都走这里。 */
  function onReading(ev) {
    if (!state.enabled) { state.ignored++; return false }
    const alpha = mpwGyroReadDeg(ev && ev.alpha)
    const beta = mpwGyroReadDeg(ev && ev.beta)
    const gamma = mpwGyroReadDeg(ev && ev.gamma)
    if (state.center.beta === null || state.center.gamma === null) {
      // 首个**有效**读数当中立位（手机怎么拿都从中心起；之后只跟"相对中立位的偏转"走）
      if (!Number.isFinite(beta) || !Number.isFinite(gamma)) { state.invalid++; return false }
      state.center.beta = beta; state.center.gamma = gamma; state.center.source = 'first-event'
    }
    const raw = mpwGyroUv(beta, gamma, { range: cfg.range, center: state.center })
    if (!raw) { state.invalid++; return false }        // ①无效读数：只计数，不碰 last/uv/下游
    state.last = { alpha: Number.isFinite(alpha) ? alpha : null, beta: beta, gamma: gamma }
    state.lastEventTime = Date.now()
    const a = Number(cfg.smooth)
    const s = (Number.isFinite(a) && a > 0 && a < 1) ? a : 1
    const u = mpwGyroClamp01(state.uv.u + (raw.u - state.uv.u) * s)
    const v = mpwGyroClamp01(state.uv.v + (raw.v - state.uv.v) * s)
    state.uv = { u: u, v: v }
    state.events++
    if (sink) { state.applied++; try { sink(u, v, state) } catch (e) { state.sinkErrors++ } }
    publish()
    return true
  }

  function attach() {
    if (state.listening) return true
    if (!win || typeof win.addEventListener !== 'function') { state.why = (state.why || '') + '+no-addEventListener'; return false }
    let n = 0
    const types = ['deviceorientation', 'deviceorientationabsolute']
    for (const t of types) { try { win.addEventListener(t, onReading, { passive: true }); n++ } catch (e) { /* 有的实现不认绝对事件 */ } }
    state.listening = n > 0
    state.listeners = n
    if (!state.listening) { state.why = (state.why || '') + '+listen-failed'; return false }
    const ms = Number(cfg.noEventMs)
    if (Number.isFinite(ms) && ms > 0 && typeof win.setTimeout === 'function') {
      try {
        timer = win.setTimeout(() => {
          if (state.events === 0 && !state.noEvents) {
            state.noEvents = true
            state.why = 'no-events'
            say('⚠ 姿态源：已挂监听但 ' + ms + 'ms 内 0 个有效事件 ⇒ 如实记账（无传感器 / 权限未批 / 非安全上下文 / 桌面浏览器都会这样）')
            publish()
          }
        }, ms)
      } catch (e) { timer = null }
    }
    return true
  }

  function detach() {
    if (timer !== null) { try { if (win && typeof win.clearTimeout === 'function') win.clearTimeout(timer) } catch (e) { /* ignore */ } timer = null }
    if (!state.listening || !win || typeof win.removeEventListener !== 'function') { state.listening = false; state.listeners = 0; return }
    for (const t of ['deviceorientation', 'deviceorientationabsolute']) {
      try { win.removeEventListener(t, onReading) } catch (e) { /* ignore */ }
    }
    state.listening = false
    state.listeners = 0
  }

  /** iOS 13+：**有** `requestPermission` 才请求；granted ⇒ 挂监听；denied/抛错 ⇒ 只记账，不抛。 */
  function requestPermission() {
    if (!mpwGyroNeedsPermission(win)) { state.permission = 'n/a'; return Promise.resolve('n/a') }
    state.permission = 'pending'
    publish()
    try {
      const p = win.DeviceOrientationEvent.requestPermission()
      return Promise.resolve(p).then((r) => {
        const res = (r === 'granted') ? 'granted' : (r === 'denied' ? 'denied' : String(r))
        state.permission = res
        if (res === 'granted') { attach(); say('① 姿态源：用户已授权（requestPermission=granted）⇒ 挂 deviceorientation'); publish() }
        else { say('⚠ 姿态源：权限未批（requestPermission=' + res + '）⇒ 如实记账，不抛'); publish() }
        return res
      }, (e) => {
        state.permission = 'error'
        say('⚠ 姿态源：requestPermission 被拒/抛错（' + ((e && e.message) || e) + '）⇒ 如实记账，不抛')
        publish()
        return 'error'
      })
    } catch (e) {
      state.permission = 'error'
      say('⚠ 姿态源：requestPermission 同步抛错（' + ((e && e.message) || e) + '）⇒ 如实记账，不抛')
      publish()
      return Promise.resolve('error')
    }
  }

  /** 用户手势里再请求一次（iOS 要求手势内调用；window 与 document 都挂，Safari 上命中哪个都行）。 */
  function armGesture() {
    if (gestureArmed) return
    gestureArmed = true
    state.gestureArmed = true
    const once = () => { try { requestPermission() } catch (e) { /* ignore */ } }
    for (const t of [win, doc]) {
      if (!t || typeof t.addEventListener !== 'function') continue
      for (const ev of ['touchend', 'click']) { try { t.addEventListener(ev, once, { once: true, passive: true }) } catch (e) { /* ignore */ } }
    }
  }

  function start() {
    state.supported = !!(win && ((typeof win.DeviceOrientationEvent !== 'undefined') || ('ondeviceorientation' in win)))
    if (mode === 'off') {
      state.enabled = false; state.why = 'mode-off'
      publish()
      say('① 姿态源未启用（`?gyro=0`）⇒ 一个监听都不挂，不喂指针/视差')
      return state
    }
    if (mode === 'auto') {
      const d = mpwGyroAutoDecide(win, nav)
      if (!d.on) {
        state.enabled = false; state.why = 'auto:' + d.why
        publish()
        say('① 姿态源未启用（auto：' + d.why + '）⇒ 交给鼠标/触摸，不抢注入通道')
        return state
      }
      state.why = 'auto:' + d.why
    } else { state.why = 'forced' }
    if (!state.supported) {
      state.enabled = false; state.why = state.why + '+unsupported'
      publish()
      say('⚠ 姿态源：本环境没有 DeviceOrientationEvent ⇒ 如实记账（可 `?gyro=1` 后用 __mpwGyroSrc.feed() 现场验证）')
      return state
    }
    state.enabled = true
    if (mpwGyroNeedsPermission(win)) { state.permission = 'pending'; armGesture() }
    else { state.permission = 'n/a'; attach() }
    publish()
    say('① 姿态源已启用（mode=' + mode + '，' + state.why + '，listeners=' + state.listeners
      + (state.permission === 'pending' ? '，等用户手势授权' : '') + '）')
    return state
  }

  function stop() {
    detach()
    state.enabled = false
    publish()
    return state
  }

  return {
    state: state, cfg: cfg, mode: mode,
    start: start, stop: stop, feed: onReading, requestPermission: requestPermission,
    setSink: (f) => { sink = (typeof f === 'function') ? f : null },
  }
}

/**
 * 桥接：姿态 (u,v) → 既有下游三条（甲 视差 mousemove / 乙 指针源 pointermove / 丙 注入通道）。
 * 每个 sink 都可单独关（`sinks:{parallax:false,...}`，判据里用来隔离变量）；计数在 `counts`。
 *
 * @param {object} [opts] `win`/`doc`/`canvas`/`getProjSize`（返回 [设计宽,设计高]）/`log`/`search`/`cfg`/
 *   `center`/`source`（复用已有姿态源）/`sinks`
 */
function mpwAttachGyroBridge(opts) {
  const o = opts || {}
  const win = o.win || (typeof window !== 'undefined' ? window : null)
  const canvas = o.canvas || null

}

  // ═══ MPW-FRAMEGEOM-BEGIN ①(P-112-BANDGEOM 2026-09-17 任务书 §5-4 / P1-6 能力对齐线) video 壁纸帧盒 ═══

    try {
      const v = String(new URLSearchParams(location.search).get('framegeom') || '').trim().toLowerCase()
      if (v === '' || v === 'legacy' || v === 'off' || v === '0' || v === 'no' || v === 'false') return 'legacy'
      if (v === 'frame') return 'cover'          // 与渲染器侧 `?framegeom=frame` 同形（= 启用模块换算）

  /** 纯函数：算出 video 帧盒（不碰 DOM 之外的东西；`tests/web-frame-geometry-wiring-test.mjs` 切片直测） */
  function videoFramePlan(natural, box, stageW, stageH, fit) {
    const aspect = contentAspectOf(box, natural)
    if (fit === 'legacy') return { fit, aspect, box: null, visible: null }
    if (!aspect) return { fit, aspect: null, box: null, visible: null }    // 量不到 ⇒ 交给 CSS（不猜）
    const vp = (fit === 'cover') ? coverViewport(stageW, stageH, aspect) : null

        { width: el.clientWidth, height: el.clientHeight },

        + (plan.visible ? (Math.round(plan.visible.width) + 'x' + Math.round(plan.visible.height) + ' @(' + Math.round(plan.visible.x) + ',' + Math.round(plan.visible.y) + ')') : '—'))

    const raw = q.get('src') || q.get('web') || ''
    const frameStatus = (input) => {
      const st = webFrameStatus(Object.assign({ mode: plan.mode }, input))

    const pub = (extra) => {

        window.__mpwWebFrame = Object.assign({}, window.__mpwWebFrame || {}, {

  // ═══ MPW-SHOT-BTN-BEGIN ①(P-88 2026-09-15 用户点名："你加一个功能上报截图的功能 —— 这样我就不用

  //   需求内核 = **抓时机**（人物面部/眉毛那一瞬），所以四条硬口径：

  // ═══ MPW-SHOT-PURE-BEGIN（纯函数；shot-upload-test.mjs 会把这小段从 demo.html 切出来单测边界）═══
  // 缩放尺寸：宽度 ≤ maxW **一个像素都不动**；超了才等比缩到 maxW（高按比例四舍五入、下限 1）。
  // 零/非法尺寸 → {w:0,h:0}（调用方据此跳过这一帧，不抛异常）。
  function shotScale(w, h, maxW) {
    const W = Math.max(0, Math.floor(Number(w) || 0)), H = Math.max(0, Math.floor(Number(h) || 0))
    const M = Math.max(1, Math.floor(Number(maxW) || 0))
    if (!W || !H) return { w: 0, h: 0, scaled: false, srcW: W, srcH: H }
    if (W <= M) return { w: W, h: H, scaled: false, srcW: W, srcH: H }
    const k = M / W
    return { w: M, h: Math.max(1, Math.round(H * k)), scaled: true, srcW: W, srcH: H }

  function shotDue(lastMs, nowMs, intervalMs) {
    const iv = Number(intervalMs)
    if (!(iv > 0)) return true
    if (lastMs === null || lastMs === undefined) return true
    const last = Number(lastMs)
    if (!isFinite(last)) return true
    return (Number(nowMs) - last) >= iv
  }
  // ═══ MPW-SHOT-PURE-END ═══
  const mpwShot = (() => {
    if (!PAGE) return null                       // 页级单例：多实例只由 primary 实例挂按钮/钩子
    const MAXW = 1920, QUALITY = 0.82
    const DEFAULT_N = 60, INTERVAL = 100, CONC = 3
    const SHOT_URL = '/shot'
    const BASE_TITLE = '单击 = 连拍 ' + DEFAULT_N + ' 帧 × ≥' + INTERVAL + 'ms（≈6 秒）自动 POST /shot（无确认框、不下载、不弹窗）；连拍中再点 = 停止并把已拍的报完。原分辨率（>1920 宽才等比缩到 1920）。快捷键：j = 单帧立即上报（精确抓时机），J（Shift+j）= 连拍'
    const QS = (k, v) => k + '=' + encodeURIComponent(String(v))
    let btn = null, endWhy = ''
    const st = {
      on: false, ended: false, n: 0, sent: 0, fail: 0, skip: 0, singles: 0,
      total: DEFAULT_N, last: null, busy: 0, queue: [], t: 0, frame: 0, t0: 0, guard: null,
    }
    function queryFor(tag, meta) {
      const parts = [QS('id', id), QS('tag', tag)]
      if (meta.t) parts.push(QS('t', meta.t))
      if (meta.note) parts.push(QS('note', meta.note))
      if (meta.w) parts.push(QS('w', meta.w), QS('h', meta.h))
      if (meta.ow) parts.push(QS('ow', meta.ow), QS('oh', meta.oh))
      if (meta.frame) parts.push(QS('frame', meta.frame))
      return SHOT_URL + '?' + parts.join('&')
    }

    function grab() {
      try {
        const sc = shotScale(cv.width, cv.height, MAXW)
        if (!sc.w || !sc.h) { logf('⚠ 连拍跳过该帧：画布尺寸为 0（' + cv.width + 'x' + cv.height + '）'); return null }
        const tc = document.createElement('canvas')
        tc.width = sc.w; tc.height = sc.h
        const cx = tc.getContext('2d')
        if (!cx) { logf('⚠ 连拍跳过该帧：2D 上下文不可用'); return null }
        cx.fillStyle = '#000'; cx.fillRect(0, 0, sc.w, sc.h)
        cx.drawImage(cv, 0, 0, sc.w, sc.h)

        const d = window.__mpwSafeDataURL ? window.__mpwSafeDataURL(tc, 'image/jpeg', QUALITY) : tc.toDataURL('image/jpeg', QUALITY)

        headers: { 'content-type': 'image/jpeg' },
        body: new Blob([job.bytes], { type: 'image/jpeg' }),

    try {
      const bar = document.getElementById('bar')
      if (bar && bar.appendChild) {

        btn.id = 'mpw-shot-btn'
        btn.type = 'button'

        try { SYSTEX.lastErr = 'canvas:' + String((e && e.message) || e).slice(0, 80) } catch (e2) {}
        return null
      }
    }
    // 把当前封面写进宿主注入点（**只动 media 两个键**，不碰别的宿主已写的 userProps/shortcuts）
    function publish() {
      try {
        const bag = (window.__mpwUserTextures && typeof window.__mpwUserTextures === 'object') ? window.__mpwUserTextures : (window.__mpwUserTextures = {})
        const media = (bag.media && typeof bag.media === 'object') ? bag.media : (bag.media = {})
        if (SYSTEX.cur) media[NAME_CUR] = NAME_CUR; else delete media[NAME_CUR]
        if (SYSTEX.prev) media[NAME_PREV] = NAME_PREV; else delete media[NAME_PREV]
        SYSTEX.published = true
      } catch (e) { /* 注入点写失败不影响渲染（回落 textures[i]） */ }
    }
    // 每帧（排在媒体 tick 之后）：封面变了就异步解码，解好换上去（旧的顺位成"上一张"）
    function sync() {
      let src = null
      try { src = mpwMediaHost && mpwMediaHost.getCoverForTexture() } catch (e) { src = null }
      if (SYSTEX.manual) return                       // 控制台手工注入优先（调 .set() 期间不吃媒体源）
      if (!src) {
        if (SYSTEX.cur || SYSTEX.prev) { SYSTEX.cur = null; SYSTEX.prev = null; SYSTEX.curKey = ''; publish() }
        return
      }
      const key = coverKey(src)
      if (!key || key === SYSTEX.curKey || key === SYSTEX.pendingKey) return
      SYSTEX.pendingKey = key
      Promise.resolve().then(() => decodeCover(src)).then((tex) => {
        if (SYSTEX.pendingKey !== key) return        // 期间又换了封面 ⇒ 丢弃这次结果
        SYSTEX.pendingKey = ''
        if (!tex) { SYSTEX.failed++; SYSTEX.lastAt = Date.now(); publish(); return }
        if (SYSTEX.cur) SYSTEX.prev = SYSTEX.cur
        SYSTEX.cur = tex; SYSTEX.curKey = key
        SYSTEX.decoded++; SYSTEX.lastAt = Date.now()
        publish()
        if (SYSTEX.decoded === 1) logf('① P-244 封面已进系统纹理槽 ' + NAME_CUR + '（' + SYSTEX.w + 'x' + SYSTEX.h
          + '；槽位声明来自 scene.json 的 usertextures，见 __mpwUserTextures.media）')
      }).catch((e) => { SYSTEX.pendingKey = ''; SYSTEX.failed++; SYSTEX.lastErr = String((e && e.message) || e).slice(0, 80) })
    }
    // 渲染器侧解析器：`resolveTexture` 钩子（按名字发纹理；**不缓存** ⇒ 每次都是当前封面）
    try {
      const ok = lib.registerMpwHook('resolveTexture', (name) => {
        if (name === NAME_CUR) return SYSTEX.cur
        if (name === NAME_PREV) return SYSTEX.prev
        return null
      })
      if (!ok) logf('⚠ P-244 系统纹理钩子注册失败（resolveTexture 槽不可用）⇒ 封面槽维持回落')
    } catch (e) { logf('⚠ P-244 系统纹理钩子注册异常: ' + ((e && e.message) || e)) }
    // 控制台入口：`__mpwSystemTex.set({bytes|url}) / .clear() / .ledger() / .state()`
    SYSTEX.set = function (src) {
      SYSTEX.manual = true
      return Promise.resolve().then(() => decodeCover(src || {})).then((tex) => {
        if (!tex) { SYSTEX.failed++; return null }
        if (SYSTEX.cur) SYSTEX.prev = SYSTEX.cur
        SYSTEX.cur = tex; SYSTEX.curKey = coverKey(src || {}) || 'manual'
        SYSTEX.decoded++; SYSTEX.lastAt = Date.now(); publish()
        return tex
      })
    }
    SYSTEX.clear = function () { SYSTEX.manual = true; SYSTEX.cur = null; SYSTEX.prev = null; SYSTEX.curKey = ''; publish(); return true }
    SYSTEX.resume = function () { SYSTEX.manual = false; return true }
    SYSTEX.state = function () { return { cur: !!SYSTEX.cur, prev: !!SYSTEX.prev, curKey: SYSTEX.curKey, decoded: SYSTEX.decoded, failed: SYSTEX.failed, w: SYSTEX.w, h: SYSTEX.h, lastErr: SYSTEX.lastErr, lastAt: SYSTEX.lastAt, ledge: lib.systemTextureLedger() } }
    if (typeof window !== 'undefined') window.__mpwSystemTexSync = sync
  })()
  // ═══ MPW-SYSTEMTEX-END ═══
  // ═══ MPW-CURSOR-BEGIN ①(P-233 批次3 C6) 官方指针事件管线：cursorHitTest → Enter/Leave/Move/Click/Down/Up ═══
  //   契约（dll-api Q8 提取的事件名序 + hongluan-mpkg 作者脚本实证）：作者脚本
  //   `export function cursorClick/cursorDown/cursorUp/cursorMove(event)`；event = { worldPosition: Vec3（设计坐标）,
  //   localPosition: Vec3（层局部）, hitBox }。命中缺省 = 引擎按"层矩形 origin±size×scale/2 自上而下"；
  //   脚本可导出 cursorHitTest(event) 自答（false = 未命中；undefined = 走引擎缺省）。
  //   派发 = dispatchScriptEvent + ownerFilter（只投命中层）；台账 window.__mpwCursorDispatch。
  if (typeof PAGE === 'undefined' || PAGE) (function () {
    const CURSOR = (window.__mpwCursorDispatch = { down: 0, up: 0, clicks: 0, enters: 0, leaves: 0, moves: 0, hits: [], last: null })
    if (!sceneScriptCache || !cv) return
    const designFromEvent = (e) => {
      let r = null
      try { r = cv.getBoundingClientRect() } catch (e2) { r = null }
      const p = (scene && scene.general && scene.general.orthogonalprojection) || {}
      const pw = Number(p.width) > 0 ? Number(p.width) : (cv.width || 1)
      const ph = Number(p.height) > 0 ? Number(p.height) : (cv.height || 1)
      const rw = (r && r.width > 0) ? r.width : (cv.width || 1)
      const rh = (r && r.height > 0) ? r.height : (cv.height || 1)
      return [(e.clientX - (r ? r.left : 0)) / rw * pw, (e.clientY - (r ? r.top : 0)) / rh * ph]
    }
    const hitLayers = (wx, wy) => {
      const hits = []
      const layers = (scene && scene.layers) || []
      for (let i = layers.length - 1; i >= 0; i--) {
        const l = layers[i]
        if (!l || !l.visible || l.isContainer || l.__lnHidden) continue
        const sw = (l.size && l.size[0] || 0) * (l.scale && l.scale[0] || 1)
        const sh = (l.size && l.size[1] || 0) * (l.scale && l.scale[1] || 1)
        if (!(sw > 0 && sh > 0) || !l.origin) continue
        if (Math.abs(wx - l.origin[0]) <= sw / 2 && Math.abs(wy - l.origin[1]) <= sh / 2) hits.push(l)
      }
      return hits
    }
    /* ③(P-228j 2026-10-05) **Enter/Leave/Move 也要派发**：作者脚本里"鼠标悬浮才出现"的一整类
       （本包 `设置1-返回` 的 `cursorEnter → getLayer('中-菜单-浮动').getEffect('阴影-设置1').visible = true`、
       `cursorLeave → false`）此前**一次都收不到**（P-233 只接了 down/up/click），于是菜单永远不出现。
       口径：`pointermove` 时比对"这一帧命中的层"与"上一帧命中的层" —— 新命中 ⇒ `cursorEnter`、
       不再命中 ⇒ `cursorLeave`、仍在命中 ⇒ `cursorMove`（都只投给命中的那一层，与 click 同一套 ownerFilter）。 */
    let __prevHits = []
    const dispatchCursorTo = (name, e, list) => {
      const [wx, wy] = designFromEvent(e)
      let st = { calls: 0, errors: 0, entries: 0 }
      for (const l of list) {
        const payload = {
          worldPosition: new MpwVec3(wx, wy, 0),
          localPosition: new MpwVec3(wx - (l.origin ? l.origin[0] : 0), wy - (l.origin ? l.origin[1] : 0), 0),
          hitBox: null,
        }
        const ownerObj = ((sceneObj && sceneObj.objects) || []).find((x) => x && l.id !== undefined && x.id === l.id) || null
        const one = dispatchScriptEvent(sceneScriptCache, name, payload, { ownerFilter: (obj) => obj === (ownerObj || l) })
        st.calls += one.calls || 0
        st.errors += one.errors || 0
        st.entries += one.entries || 0
      }
      const key = name === 'cursorClick' ? 'clicks' : name === 'cursorDown' ? 'down' : name === 'cursorUp' ? 'up' : name === 'cursorEnter' ? 'enters' : name === 'cursorLeave' ? 'leaves' : 'moves'
      CURSOR[key] = (CURSOR[key] || 0) + st.calls
      CURSOR.lastDispatch = { name, calls: st.calls, errors: st.errors, entries: st.entries }
      CURSOR.last = { name, wx: Math.round(wx), wy: Math.round(wy), hits: list.map((l) => String(l.name || l.id)).slice(0, 8), at: Date.now() }
      return st
    }
    const dispatchMove = (e) => {
      const [wx, wy] = designFromEvent(e)
      const hits = hitLayers(wx, wy)
      const prev = __prevHits
      __prevHits = hits
      const gone = prev.filter((l) => hits.indexOf(l) < 0)
      const fresh = hits.filter((l) => prev.indexOf(l) < 0)
      if (gone.length) dispatchCursorTo('cursorLeave', e, gone)
      if (fresh.length) dispatchCursorTo('cursorEnter', e, fresh)
      if (hits.length) dispatchCursorTo('cursorMove', e, hits)
      CURSOR.hits = hits.map((l) => String(l.name || l.id)).slice(0, 8)
    }
    /* 点击/按下/抬起：命中层**各投一遍**（与悬浮三态共用 `dispatchCursorTo`，台账同一本账）。
       聚合量在 `dispatchCursorTo` 里初始化于循环外 ⇒ 空命中不再抛 `st is not defined`（P-228i）。 */
    const dispatchCursor = (name, e) => {
      const [wx, wy] = designFromEvent(e)
      const hits = hitLayers(wx, wy)
      CURSOR.hits = hits.map((l) => String(l.name || l.id)).slice(0, 8)
      return dispatchCursorTo(name, e, hits)
    }
    cv.addEventListener('pointermove', (e) => { try { dispatchMove(e) } catch (e2) { /* 悬浮派发失败不影响其它 */ } })
    cv.addEventListener('pointerdown', (e) => { CURSOR.down++; dispatchCursor('cursorDown', e) })
    cv.addEventListener('pointerup', (e) => { CURSOR.up++; dispatchCursor('cursorUp', e) })
    cv.addEventListener('click', (e) => { dispatchCursor('cursorClick', e) })
    logf('① P-233/P-228j 指针事件管线已接线（cursorDown/Up/Click + cursorEnter/Leave/Move → 命中层脚本；命中台账 __mpwCursorDispatch）')
  })()
  // ═══ MPW-CURSOR-END ═══
  // ═══ ①(P-77 一页多实例·第 5 步) 实例句柄：调度器驱动 or 单实例自驱 + **显式释放路径** ═══
  //   释放必须显式（设计文档 §2.2 disposed）：`WEBGL_lose_context.loseContext()` + 清引用 + 从调度器摘除。
  //   否则来回切实例 = 显存只涨不落（本机 15G 内存曾 swap 到 10G）。
  const mpwHandle = {
    id, canvas: cv, gl, ctx: inst.ctx,
    frame,
    dispose: () => {
      mpwDisposed = true;
      try { if (rafId != null) cancelAnimationFrame(rafId) } catch (e) {}
      rafId = null;
      // ①(2026-09-21 活档位) 摘掉本实例装的 ResizeObserver / resize / DPR 媒体查询监听
      //   （多实例来回切时不留悬挂监听；`inst` 是本实例记录，装载时就写好的那个对象）
      try { if (typeof inst.liveResDispose === 'function') inst.liveResDispose() } catch (e) {}
      try { mpwLoseContext(gl) } catch (e) { logf('⚠ loseContext 失败: ' + ((e && e.message) || e)) }
      // ①(2026-09-24 任务 ⑱) 释放实例时把音频链一起收掉（实现与判据见 mpwReleaseSceneAudio）
      try { mpwReleaseSceneAudio() } catch (e) {}
      try {
        for (const t of textures.values()) {
          if (!t) continue;
          if (t.video) {
            try { t.video.pause() } catch (e) {}
            try { if (t.video.src && String(t.video.src).indexOf('blob:') === 0) URL.revokeObjectURL(t.video.src) } catch (e) {}
            try { if (t.video.parentNode) t.video.parentNode.removeChild(t.video) } catch (e) {}
          }
          t.glTex = null; t.rgba = null; t.canvas = null;
        }
      } catch (e) {}
      try { textures.clear() } catch (e) {}
      // 清引用：scene/renderer/pkg 都是大对象（纹理/FBO/网格缓冲挂在 renderer 上）
      renderer = null; scene = null; pkg = null;
      logf('① 实例已释放（' + id + '）：loseContext + 清引用 + 从调度器摘除');
    },
  };
  if (SCHEDULED) {
    // 多实例：帧交给**唯一**的调度器（multi-instance.js），这里不自排 rAF
    try { if (typeof inst.onReady === 'function') inst.onReady(mpwHandle) } catch (e) {}
  } else {
    rafId = requestAnimationFrame(frame);
  }
  // ①(2026-09-21 宿主 API) 实例句柄就绪 ⇒ `__wp.release()` 用它（与 P-77 的显式释放同一条路）
  mpwHostDisposeFn = () => mpwHandle.dispose();
  return mpwHandle;
}
// ═══ ①(P-77 一页多实例·第 1~5 步) 两个调用点 ═══
//   ① 无 `?ids=` ⇒ **单实例调用点**：inst 字段就是原来的模块级常量、primary=true ⇒ 页级 UI/上报全开，
//      与改动前逐位一致（红线）。② 有 `?ids=` ⇒ 建多实例宿主：N 个 canvas/context（≤ maxinst），
//      **只有被点中的实例在跑**，其余 0 帧；释放走 loseContext。
if (MPW_MULTI_IDS) {
  // 多实例：`#sc` 让位给网格（它的上下文根本没创建，见上面 gl 的写法）
  try { cv.style.display = 'none' } catch (e) {}
  const mpwInstBoot = (rec) => {
    // 每个格子自己取一个 webgl2 上下文（上限由 maxinst 硬性封顶；超限的格子上面就不建 canvas）
    const glI = rec.canvas.getContext('webgl2', lib.glCanvasAttrs(location.search));   // ①(第 24 条) 同一来源
    if (!glI) throw new Error('该格子取不到 WebGL2 上下文（可能已达浏览器上下文上限）');
    return bootInstance({
      canvas: rec.canvas, gl: glI, id: rec.id,
      primary: rec.i === 0,        // 页级 UI/上报只在第一个格子（primary）上跑
      scheduled: true,             // 帧由调度器推进（不自排 rAF）
      res: MPW_MULTI_BUDGET.res,   // 预算降档（maxinst ≥ 3 → 720p；?res= 已让位）
      particleBudget: MPW_MULTI_BUDGET.particleBudget,
      ctx: rec.ctx,
      logEl: log, fpsEl,
      logf: mpwMultiHost.logfFor(rec.i),
    });
  };
  mpwMultiHost = createMultiInstanceHost({
    ids: MPW_MULTI_IDS.ids, invalid: MPW_MULTI_IDS.invalid, dupes: MPW_MULTI_IDS.dupes,
    opts: MPW_MULTI_OPTS, budget: MPW_MULTI_BUDGET,
    doc: document, win: window, logEl: log,
    boot: mpwInstBoot,
    onSnapshot: (rows, instances) => {
      try { window.__mpwInstances = rows } catch (e) {}
      // ①(设计文档 §2.5) 既有单例 __mpw* 全局**保持不变**，多实例时指向 **active 实例**：
      //   这里把 active 的 fps 镜像到 window.__mpwFps（旧消费者读的就是它）。
      try {
        const a = instances.find((r) => r.selected) || instances[0];
        if (a) { window.__mpwInstActive = a.id; window.__mpwFps = Math.round(a.fps) }
      } catch (e) {}
    },
    onState: (rec) => { try { window.__mpwInstActive = rec.id } catch (e) {} },
  });
  try { window.__mpwInstBudget = { maxinst: MPW_MULTI_BUDGET.maxinst, res: MPW_MULTI_BUDGET.res, downgrade: MPW_MULTI_BUDGET.downgrade, over: MPW_MULTI_BUDGET.over, reasons: MPW_MULTI_BUDGET.reasons } } catch (e) {}
  logf('① 一页多实例：' + MPW_MULTI_IDS.ids.length + ' 个 id（上限 ' + MPW_MULTI_BUDGET.maxinst + '，布局 ' + MPW_MULTI_OPTS.layout
    + '，非当前实例 ' + MPW_MULTI_OPTS.inactive + '）'
    + (MPW_MULTI_BUDGET.downgrade ? '；' + MPW_MULTI_BUDGET.reasons.join('；') : '')
    + (MPW_MULTI_IDS.invalid.length ? '；忽略非法 id ' + MPW_MULTI_IDS.invalid.length + ' 个' : '')
    + (MPW_MULTI_IDS.dupes.length ? '；去重 ' + MPW_MULTI_IDS.dupes.length + ' 个' : ''))
  MPW_MULTI_OPTS.notes.forEach((n) => logf('  ⚠ ' + n))
  mpwMultiHost.observeVisibility();
  mpwMultiHost.start().then(() => {
    logf('① 多实例装载完成：' + mpwMultiHost.instances.filter((r) => r.handle).length + ' 个在跑（其余暂停，点格子激活）');
  }).catch((e) => {
    logf('❌ 多实例启动失败: ' + ((e && e.message) || e));
    try { window.__mpwCapErr && window.__mpwCapErr('multi: ' + String((e && e.message) || e)) } catch (e2) {}
  });
} else {
// ═══ ①(P-77 一页多实例·第 1 步) 单实例调用点：inst 字段**就是**原来的模块级常量 ═══
//   无 ?ids= 时走这里：一个实例、primary=true ⇒ 页面级 UI/上报路径全开（与改动前逐位一致）。
const MPW_PRIMARY_INST = { canvas: cv, gl, id, logEl: log, fpsEl, logf, primary: true };
bootInstance(MPW_PRIMARY_INST).catch((e) => { logf('❌ 启动失败: ' + e.message); try { window.__mpwCapErr && window.__mpwCapErr('boot: ' + String((e && e.message) || e)) } catch (e2) {} ; /* ①(2026-10-13 空态修复) 启动失败 ⇒ 立起"无壁纸/无法出画"占位（全屏黑画布不再是唯一结果） */ try { if (window.__mpwEmptyState) window.__mpwEmptyState.fail(e) } catch (e3) {} });
}
} // end !elysia
