<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      移动端 WebView（安卓壁纸宿主）默认按 980px 宽的桌面视口排版，再整体缩放到
      屏宽。壁纸画布是 position:fixed;inset:0，在那个虚拟视口下会被撑成 980×N，
      缩放后画面按桌面宽高比 letterbox 居中，竖屏上下留出大片空白。
      锁定 viewport 到设备宽度，画布才等于真实屏幕，cover 裁切才按真实比例算。
      桌面宿主没有 viewport 概念，这个标签对它无副作用。
    -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>WEwebLoader Renderer</title>
    <!--
      P-350（2026-10-16）本页从「**上游渲染器产物页**」改造为「**渲染器适配器装载页**」。

      为什么改：仓库内那份上游渲染器产物（`demo/assets/renderer-n-Rw_ZVc.js`，
      1,067,707 B / sha256 167d87f8…）已按用户口径移除 —— 本页以前 `script src` 直接
      指着它，产物一没就是一具白屏。现在改成"按契约挑一档渲染器"：

        · 契约与注册表 / 选择开关 / 生命周期 = `core/renderer-adapter.mjs`（零依赖纯模块）；
        · 本页的 DOM 驱动器 = `./adapter-boot.mjs`（建 iframe、探测候选页、转事件、发布信号）；
        · **本仓渲染器**（`repo`，顶层直接打开时的缺省档）⇒ 容器内装载；
        · **上游 / 第三方**渲染器 ⇒ 走**外部**来源：`?rendererSrc=<URL|路径>`，或服务端设
          `MPW_RENDERER_UPSTREAM=<URL>`；**不要求**仓库内置任何上游产物（现在仓内是 0 份）；
        · 挑不出可用渲染器 ⇒ **明确 SKIP 面板**（写明原因与下一步），不是白屏、不是崩。

      P-93（在线 demo）相对路径的约束仍然成立：本页同时挂在 `/demo/renderer/`、
      `/WEwebLoader/renderer/` 与 `/wallpaper-engine-webgl/renderer/` 三种前缀下，
      所以这里只用**相对**说明符（`./adapter-boot.mjs`；它内部再以 `../../core/…` 取契约模块，
      在三种前缀与 GitHub Pages 的站点根下都解析到同一份 `core/renderer-adapter.mjs`）。
    -->
    <style>
      /* 壁纸页没有文档流内容。去掉默认边距，并关掉移动端的滚动回弹、
         长按选择与点击高亮 —— 否则触摸交互会被 WebView 自己的手势吃掉。 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* SKIP / 降级面板：**必须看得见**（白屏与"静默通过"是本仓明令禁止的两种失败形态）。
         装载成功时由脚本把它隐藏，画布照旧铺满整屏。 */
      #notice {
        position: fixed;
        inset: 0;
        z-index: 2;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        overflow: auto;
        background: #0d111a;
        color: #cccccc;
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        -webkit-user-select: text;
        user-select: text;
      }
      #notice[data-mpw-adapter-notice='skip'] {
        border-top: 4px solid #f48771;
      }
      #notice[data-mpw-adapter-notice='error'] {
        border-top: 4px solid #f48771;
      }
      #notice[data-mpw-adapter-notice='warn'] {
        border-top: 4px solid #d7ba7d;
      }
      #notice[data-mpw-adapter-notice='ok'] {
        border-top: 4px solid #0078d4;
      }
      #notice p {
        margin: 0 0 10px;
      }
      #notice a {
        color: #4daafc;
      }
      #mount {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <div id="notice" hidden></div>
    <script type="module" src="./adapter-boot.mjs"></script>
  </body>
</html>
